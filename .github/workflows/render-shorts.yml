name: Render Shorts Video

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project folder name (under projects/)'
        required: true
        default: 'kiss-physiology-shorts'
      composition:
        description: 'Composition ID to render'
        required: true
        default: 'KissPhysiologyShorts'

permissions:
  contents: read
  actions: write
  checks: write

jobs:
  render:
    name: Render Remotion Video
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: remotion-composer/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install npm dependencies
        working-directory: remotion-composer
        run: npm ci

      - name: Copy project assets to remotion-composer
        run: |
          set -e
          PROJECT="projects/${{ github.event.inputs.project }}"
          echo "Project path: $PROJECT"
          ls -la "$PROJECT/"

          # Copy fonts
          mkdir -p remotion-composer/public/fonts
          if [ -d "$PROJECT/assets/fonts" ]; then
            cp "$PROJECT/assets/fonts/"* remotion-composer/public/fonts/ 2>/dev/null || true
          fi

          # Copy music
          mkdir -p remotion-composer/public/music
          if [ -d "$PROJECT/assets/music" ]; then
            cp "$PROJECT/assets/music/"* remotion-composer/public/music/ 2>/dev/null || true
          fi

          # Copy components to remotion-composer src (where tsconfig applies)
          mkdir -p remotion-composer/src/components/kiss-physiology-shorts
          for f in MuscleSilhouette.tsx StatCard.tsx HormoneCascade.tsx ParticleFlow.tsx FrequencyLadder.tsx KissPhysiologyShorts.tsx; do
            if [ -f "$PROJECT/$f" ]; then
              cp "$PROJECT/$f" remotion-composer/src/components/kiss-physiology-shorts/
              echo "Copied $f"
            else
              echo "WARNING: $PROJECT/$f not found"
            fi
          done

          ls -la remotion-composer/src/components/kiss-physiology-shorts/

      - name: Render video
        working-directory: remotion-composer
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          npx remotion render \
            src/Root.tsx \
            ${{ github.event.inputs.composition }} \
            out/video.mp4 \
            --props=../projects/${{ github.event.inputs.project }}/artifacts/composition_props.json \
            --concurrency=2

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: remotion-composer/out/video.mp4
          retention-days: 7

      - name: Create release (if on main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: shorts-${{ github.event.inputs.project }}-${{ github.run_number }}
          name: "${{ github.event.inputs.project }} Shorts Render #${{ github.run_number }}"
          files: remotion-composer/out/video.mp4
          draft: false
          prerelease: false
          generate_release_notes: true