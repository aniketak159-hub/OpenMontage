name: Render Shorts Video

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project folder name (under projects/)'
        required: true
        default: 'kiss-physiology-shorts'
      composition:
        description: 'Composition ID to render'
        required: true
        default: 'KissPhysiologyShorts'

permissions:
  contents: read
  actions: write
  checks: write

jobs:
  render:
    name: Render Remotion Video
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: remotion-composer/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2

      - name: Install npm dependencies
        working-directory: remotion-composer
        run: npm ci

      - name: Copy project assets to remotion-composer
        run: |
          # Copy fonts
          mkdir -p remotion-composer/public/fonts
          cp -r "projects/${{ github.event.inputs.project }}/assets/fonts/"* remotion-composer/public/fonts/ 2>/dev/null || true

          # Copy music
          mkdir -p remotion-composer/public/music
          cp -r "projects/${{ github.event.inputs.project }}/assets/music/"* remotion-composer/public/music/ 2>/dev/null || true

          # Copy components
          mkdir -p remotion-composer/src/components/kiss-physiology-shorts
          cp -r "projects/${{ github.event.inputs.project }}/"MuscleSilhouette.tsx "projects/${{ github.event.inputs.project }}/"StatCard.tsx "projects/${{ github.event.inputs.project }}/"HormoneCascade.tsx "projects/${{ github.event.inputs.project }}/"ParticleFlow.tsx "projects/${{ github.event.inputs.project }}/"FrequencyLadder.tsx "projects/${{ github.event.inputs.project }}/"KissPhysiologyShorts.tsx remotion-composer/src/components/kiss-physiology-shorts/ 2>/dev/null || true

      - name: Render video
        working-directory: remotion-composer
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          npx remotion render \
            src/Root.tsx \
            ${{ github.event.inputs.composition }} \
            out/video.mp4 \
            --props=../projects/${{ github.event.inputs.project }}/artifacts/composition_props.json \
            --concurrency=2

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: remotion-composer/out/video.mp4
          retention-days: 7

      - name: Create release (if on main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: shorts-${{ github.event.inputs.project }}-${{ github.run_number }}
          name: "${{ github.event.inputs.project }} Shorts Render #${{ github.run_number }}"
          files: remotion-composer/out/video.mp4
          draft: false
          prerelease: false
          generate_release_notes: true