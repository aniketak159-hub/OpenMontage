name: Render Shorts Video

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project folder name (under projects/)'
        required: true
        default: 'kiss-physiology-shorts'
      composition:
        description: 'Composition ID to render'
        required: true
        default: 'KissPhysiologyShorts'

permissions:
  contents: read
  actions: write
  checks: write

jobs:
  render:
    name: Render Remotion Video
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: remotion-composer/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install npm dependencies
        working-directory: remotion-composer
        run: npm ci

      # Assets and components are pre-copied to remotion-composer in the repository

      - name: Render video
        working-directory: remotion-composer
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          npx remotion render \
            src/Root.tsx \
            ${{ github.event.inputs.composition }} \
            out/video.mp4 \
            --props=../projects/${{ github.event.inputs.project }}/artifacts/composition_props.json \
            --concurrency=2 \
            --verbose 2>&1 | tee render.log
          echo "Exit code: ${PIPESTATUS[0]}"
          ls -la out/

      - name: Show render log (on failure)
        if: failure()
        run: cat remotion-composer/render.log

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: remotion-composer/out/video.mp4
          retention-days: 7

      - name: Upload render log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-log
          path: remotion-composer/render.log
          retention-days: 7

      - name: Create release (if on main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: shorts-${{ github.event.inputs.project }}-${{ github.run_number }}
          name: "${{ github.event.inputs.project }} Shorts Render #${{ github.run_number }}"
          files: remotion-composer/out/video.mp4
          draft: false
          prerelease: false
          generate_release_notes: true